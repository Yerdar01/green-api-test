<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GREEN-API Test Task</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Левая колонка: Управление -->
        <div class="controls">
            
            <!-- Карточка: Авторизация и состояние -->
            <div class="card">
                <h3 class="card-title">Авторизация и состояние</h3>
                
                <div class="floating-group">
                    <input type="text" id="idInstance" class="floating-input" placeholder=" " autocomplete="off">
                    <label for="idInstance" class="floating-label">ID инстанса (idInstance)*</label>
                </div>
                <div class="floating-group">
                    <input type="password" id="ApiTokenInstance" class="floating-input" placeholder=" " autocomplete="off" spellcheck="false">
                    <label for="ApiTokenInstance" class="floating-label">API Токен (ApiTokenInstance)*</label>
                </div>
                
                <div class="button-group">
                    <button id="btn-getSettings" type="button">Получить настройки (getSettings)</button>
                    <button id="btn-getStateInstance" type="button">Проверить статус (getStateInstance)</button>
                </div>
            </div>

            <!-- Карточка: Отправка сообщения -->
            <div class="card">
                <h3 class="card-title">Отправка сообщения</h3>
                <div class="floating-group">
                    <input type="text" id="chatIdMessage" class="floating-input" placeholder=" ">
                    <label for="chatIdMessage" class="floating-label">Номер телефона (chatId)*</label>
                </div>
                <div class="floating-group">
                    <textarea id="messageText" class="floating-input textarea-input" placeholder=" "></textarea>
                    <label for="messageText" class="floating-label">Текст сообщения*</label>
                </div>
                <button id="btn-sendMessage" type="button">Отправить сообщение (sendMessage)</button>
            </div>

            <!-- Карточка: Отправка файла -->
            <div class="card">
                <h3 class="card-title">Отправка файла по URL</h3>
                <div class="floating-group">
                    <input type="text" id="chatIdFile" class="floating-input" placeholder=" ">
                    <label for="chatIdFile" class="floating-label">Номер телефона (chatId)*</label>
                </div>
                <div class="floating-group">
                    <input type="text" id="fileUrl" class="floating-input" placeholder=" ">
                    <label for="fileUrl" class="floating-label">Ссылка на файл (urlFile)*</label>
                </div>
                <button id="btn-sendFileByUrl" type="button">Отправить файл (sendFileByUrl)</button>
            </div>
            
        </div>

        <!-- Правая колонка: Результат (Терминал) -->
        <div class="result">
            <h3 class="card-title terminal-title">Ответ сервера (JSON)</h3>
            <textarea id="apiResponse" readonly placeholder="Ожидание запроса..."></textarea>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
